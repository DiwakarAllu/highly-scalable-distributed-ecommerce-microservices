server:
  port: 9000 # gateway server port
  forward-headers-strategy: native # handle forwarded headers

spring:
  application:
    name: api-gateway # application name

  main:
    web-application-type: reactive # use reactive web stack

  # Security (Keycloak JWT)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/ecommerce-realm # JWT issuer URI

  cloud:
    gateway:
      # global CORS configuration
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
      #            allowCredentials: true # uncomment if credentials are needed

      # Routes to downstream services
      routes:
        # Product service route
        - id: product-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productServiceCircuit
                fallbackUri: forward:/fallback/products
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET

        # Product service Swagger aggregation
        - id: product-service-swagger
          uri: http://localhost:8080
          predicates:
            - Path=/aggregate/product-service/api-docs
          filters:
            - SetPath=/api-docs
            - AddResponseHeader=Content-Type, application/json

        # Order service route
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCircuit
                fallbackUri: forward:/fallback/orders

        # Order service Swagger aggregation
        - id: order-service-swagger
          uri: http://localhost:8081
          predicates:
            - Path=/aggregate/order-service/api-docs
          filters:
            - SetPath=/api-docs
            - AddResponseHeader=Content-Type, application/json

        # Inventory service route
        - id: inventory-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryServiceCircuit
                fallbackUri: forward:/fallback/inventory

        # Inventory service Swagger aggregation
        - id: inventory-service-swagger
          uri: http://localhost:8082
          predicates:
            - Path=/aggregate/inventory-service/api-docs
          filters:
            - SetPath=/api-docs
            - AddResponseHeader=Content-Type, application/json

# RESILIENCE4J configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s

# Swagger / OpenAPI aggregation through gateway
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    urls:
      - name: Product Service
        url: /aggregate/product-service/api-docs
      - name: Order Service
        url: /aggregate/order-service/api-docs
      - name: Inventory Service
        url: /aggregate/inventory-service/api-docs

# logging level for gateway
logging:
  level:
    org.springframework.cloud.gateway: DEBUG

# Actuator Endpoints
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      application: api-gateway
  tracing:
    sampling:
      probability: 1.0


# Loki URL
loki.url: http://localhost:3100/loki/api/v1/push
